services:
  db:
    image: postgres:18-alpine
    container_name: jg-crm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jg-crm-test-db
    ports:
      - "5434:5432"
    volumes:
      - jg-crm-data:/var/lib/postgresql

volumes:
  jg-crm-data:
