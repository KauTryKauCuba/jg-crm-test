services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jg-crm-app
    restart: always
    ports:
      - "3006:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/jg-crm-test-db
      - NODE_ENV=production
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: jg-crm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jg-crm-test-db
    ports:
      - "5434:5432"
    volumes:
      - jg-crm-data:/var/lib/postgresql

volumes:
  jg-crm-data:
